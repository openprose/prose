name: LongCoT Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "pi --model, e.g. anthropic/claude-opus-4-5, openai/gpt-5.2, google/gemini-3-pro, openrouter/deepseek/deepseek-v3.2"
        type: string
        default: "anthropic/claude-opus-4-5"
      thinking:
        description: "Thinking level passed to pi"
        type: choice
        default: "high"
        options:
          - "off"
          - "minimal"
          - "low"
          - "medium"
          - "high"
          - "xhigh"
      domain:
        description: "LongCoT domain filter"
        type: choice
        default: "all"
        options:
          - "all"
          - "logic"
          - "cs"
          - "chemistry"
          - "chess"
          - "math"
      difficulty:
        description: "LongCoT difficulty filter (longcot = paper-match ~1995q; longcot-mini ~507q for iteration)"
        type: choice
        default: "longcot"
        options:
          - "longcot"
          - "longcot-mini"
          - "easy"
          - "medium"
          - "hard"
          - "all"
      max_questions:
        description: "Cap on questions (0 = no cap)"
        type: string
        default: "0"
      offset:
        description: "Resume offset applied after shuffle"
        type: string
        default: "0"
      seed:
        description: "Shuffle seed"
        type: string
        default: "0"
      concurrency:
        description: "Parallel pi subprocesses"
        type: string
        default: "8"
      system_prompt:
        description: "System prompt passed to pi"
        type: string
        default: "You are a helpful assistant."
      pi_version:
        description: "npm tag/version for @mariozechner/pi-coding-agent"
        type: string
        # Pinned to an exact version rather than a moving tag like `latest`: this job
        # installs pi globally and then runs it with five LLM provider keys in scope,
        # so a moving tag executes whatever was published most recently. The repo's 48h
        # publish cooldown does not cover this — `minimumReleaseAge` in
        # pnpm-workspace.yaml is a pnpm setting and this is a global npm install.
        # Bump deliberately.
        default: "0.73.1"
      longcot_ref:
        description: "git ref (branch/tag/sha) of LongHorizonReasoning/longcot to clone"
        type: string
        # Pinned to an immutable commit rather than `main`: this job executes the
        # checked-out repo's Python with five LLM provider keys in scope, so a moving ref
        # would run whatever landed upstream. Bump deliberately after reviewing the diff.
        default: "fb9649423f15f5b0091f8e988b100596cac592ca" # main @ 2026-04-20
      run_eval:
        description: "Run LongCoT scoring step after responses are generated"
        type: boolean
        default: true
      fallback_judge:
        description: "Allow run_eval.py fallback judge (pass --no-fallback when false)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: longcot-bench-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  longcot:
    name: Run LongCoT via pi-mono
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout prose
        uses: actions/checkout@v4

      - name: Checkout LongCoT
        uses: actions/checkout@v4
        with:
          repository: LongHorizonReasoning/longcot
          ref: ${{ inputs.longcot_ref }}
          path: longcot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pi-mono
        shell: bash
        # Dispatch inputs reach the script through the environment, never through
        # `${{ }}` interpolation: expressions are substituted before bash parses the
        # script, so an input containing shell syntax would run as code.
        env:
          LONGCOT_PI_VERSION: ${{ inputs.pi_version }}
        run: |
          set -euo pipefail
          npm install -g "@mariozechner/pi-coding-agent@$LONGCOT_PI_VERSION"
          pi --version || pi --help | head -1

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install LongCoT deps
        shell: bash
        run: |
          set -euo pipefail
          cd longcot
          uv sync --frozen

      - name: Compute output paths
        shell: bash
        run: |
          set -euo pipefail
          echo "RESPONSES_PATH=responses/run_${{ github.run_id }}_${{ github.run_attempt }}.jsonl" >> "$GITHUB_ENV"
          echo "RESULTS_PATH=results/run_${{ github.run_id }}_${{ github.run_attempt }}.json" >> "$GITHUB_ENV"

      - name: Run pi shim over LongCoT
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LONGCOT_MODEL: ${{ inputs.model }}
          LONGCOT_THINKING: ${{ inputs.thinking }}
          LONGCOT_DOMAIN: ${{ inputs.domain }}
          LONGCOT_DIFFICULTY: ${{ inputs.difficulty }}
          LONGCOT_MAX_QUESTIONS: ${{ inputs.max_questions }}
          LONGCOT_OFFSET: ${{ inputs.offset }}
          LONGCOT_SEED: ${{ inputs.seed }}
          LONGCOT_CONCURRENCY: ${{ inputs.concurrency }}
          LONGCOT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        run: |
          set -euo pipefail
          cd longcot
          uv run python ../.github/scripts/longcot/run_pi.py \
            --model "$LONGCOT_MODEL" \
            --thinking "$LONGCOT_THINKING" \
            --domain "$LONGCOT_DOMAIN" \
            --difficulty "$LONGCOT_DIFFICULTY" \
            --max-questions "$LONGCOT_MAX_QUESTIONS" \
            --offset "$LONGCOT_OFFSET" \
            --seed "$LONGCOT_SEED" \
            --concurrency "$LONGCOT_CONCURRENCY" \
            --system-prompt "$LONGCOT_SYSTEM_PROMPT" \
            --output "$RESPONSES_PATH"

      - name: Run LongCoT eval
        if: ${{ inputs.run_eval == true }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LONGCOT_FALLBACK_JUDGE: ${{ inputs.fallback_judge }}
        run: |
          set -euo pipefail
          cd longcot
          EXTRA_ARGS=""
          if [[ "$LONGCOT_FALLBACK_JUDGE" == "false" ]]; then
            EXTRA_ARGS="--no-fallback"
          fi
          uv run python run_eval.py "$RESPONSES_PATH" --output "$RESULTS_PATH" $EXTRA_ARGS

      - name: Write job summary
        if: always()
        shell: bash
        env:
          LONGCOT_MODEL: ${{ inputs.model }}
          LONGCOT_THINKING: ${{ inputs.thinking }}
          LONGCOT_DOMAIN: ${{ inputs.domain }}
          LONGCOT_DIFFICULTY: ${{ inputs.difficulty }}
          LONGCOT_MAX_QUESTIONS: ${{ inputs.max_questions }}
          LONGCOT_RUN_EVAL: ${{ inputs.run_eval }}
        run: |
          set -euo pipefail
          {
            echo "# LongCoT Benchmark"
            echo ""
            echo "| Input | Value |"
            echo "| --- | --- |"
            echo "| model | \`$LONGCOT_MODEL\` |"
            echo "| thinking | \`$LONGCOT_THINKING\` |"
            echo "| domain | \`$LONGCOT_DOMAIN\` |"
            echo "| difficulty | \`$LONGCOT_DIFFICULTY\` |"
            echo "| max_questions | \`$LONGCOT_MAX_QUESTIONS\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LONGCOT_RUN_EVAL" == "true" ]]; then
            RESULTS_FILE="longcot/$RESULTS_PATH"
            if [[ -f "$RESULTS_FILE" ]]; then
              {
                echo "## Results"
                echo ""
                echo "| Metric | Value |"
                echo "| --- | --- |"
                for key in total correct incorrect failed wrong_formatting accuracy overall_accuracy; do
                  val=$(jq -r --arg k "$key" '.[$k] // (.. | objects | select(has($k)) | .[$k]) // "n/a"' "$RESULTS_FILE" | head -n1)
                  echo "| $key | \`$val\` |"
                done
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "_Results file not found at \`$RESULTS_FILE\`._" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            RESP_FILE="longcot/$RESPONSES_PATH"
            if [[ -f "$RESP_FILE" ]]; then
              LINES=$(wc -l < "$RESP_FILE" | tr -d ' ')
              {
                echo "## Responses"
                echo ""
                echo "Eval skipped (\`run_eval=false\`). Responses JSONL line count: \`$LINES\`."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "_Responses file not found at \`$RESP_FILE\`._" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload responses artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longcot-responses-${{ github.run_id }}
          path: longcot/responses/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longcot-results-${{ github.run_id }}
          path: longcot/results/**
          retention-days: 30
          if-no-files-found: warn
