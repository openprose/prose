name: Plugin Manifest

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - ".github/plugin/**"
      - "skills/open-prose/**"
      - "scripts/bump-version.sh"
      - "scripts/release-preflight.sh"
      - "scripts/sync-copy.sh"
      - ".version-bump.json"
      - ".plugin-meta.json"
      - "assets/plugin/**"
      - "CHANGELOG.md"
      - ".github/workflows/plugin-manifest.yml"
  push:
    branches:
      - main
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - ".github/plugin/**"
      - "skills/open-prose/**"
      - "scripts/bump-version.sh"
      - "scripts/release-preflight.sh"
      - "scripts/sync-copy.sh"
      - ".version-bump.json"
      - ".plugin-meta.json"
      - "assets/plugin/**"
      - "CHANGELOG.md"
      - ".github/workflows/plugin-manifest.yml"

permissions:
  contents: read

concurrency:
  group: plugin-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Claude plugin manifest
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json","utf8"));
            if (!m.name || !m.version) { console.error("missing name/version"); process.exit(1); }
            const skillsField = String(m.skills || "./skills").replace(/^\.\//,"").replace(/\/$/,"");
            const target = skillsField + "/open-prose/SKILL.md";
            if (!fs.existsSync(target)) { console.error("skills path not found: " + target); process.exit(1); }
            console.log("ok: claude plugin manifest");
          '

      - name: Validate Codex plugin manifest
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".codex-plugin/plugin.json","utf8"));
            if (!m.name || !m.version) { console.error("missing name/version"); process.exit(1); }
            if (!m.interface || !m.interface.displayName) { console.error("missing interface.displayName"); process.exit(1); }
            const skillsField = String(m.skills || "./skills").replace(/^\.\//,"").replace(/\/$/,"");
            const target = skillsField + "/open-prose/SKILL.md";
            if (!fs.existsSync(target)) { console.error("skills path not found: " + target); process.exit(1); }
            const mp = JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json","utf8"));
            if (!Array.isArray(mp.plugins) || mp.plugins[0].name !== "open-prose") { console.error("agents/plugins/marketplace.json mismatch"); process.exit(1); }
            console.log("ok: codex plugin manifest");
          '

      - name: OpenProse versions in sync
        run: ./scripts/bump-version.sh --check

      - name: Verify skill version bump in a disposable tree
        run: |
          set -euo pipefail
          version_root="$(mktemp -d "$RUNNER_TEMP/openprose-version.XXXXXX")"
          trap 'rm -rf -- "$version_root"' EXIT
          mkdir -p "$version_root/scripts"
          cp .version-bump.json "$version_root/"
          cp scripts/bump-version.sh "$version_root/scripts/"
          while IFS= read -r target; do
            mkdir -p "$version_root/$(dirname "$target")"
            cp "$target" "$version_root/$target"
          done < <(jq -r '.tracks.skill.files[].path' .version-bump.json)
          bash "$version_root/scripts/bump-version.sh" --track skill 0.0.0
          bash "$version_root/scripts/bump-version.sh" --check --track skill

      - name: Plugin copy in sync
        run: ./scripts/sync-copy.sh --check

      - name: Plugin assets exist
        run: |
          test -f assets/plugin/logo.png
          test -f assets/plugin/composer-icon.png
          file assets/plugin/logo.png          | grep -q 'PNG image data, 512 x 512'
          file assets/plugin/composer-icon.png | grep -q 'PNG image data, 64 x 64'

      - name: Codex interface has visual assets
        run: |
          jq -e '.interface.logo and .interface.composerIcon and .interface.brandColor and .interface.websiteURL' .codex-plugin/plugin.json
          jq -re '.interface.brandColor' .codex-plugin/plugin.json | grep -E '^#[0-9A-Fa-f]{6}$'

      - name: Registry names unified to openprose
        run: |
          jq -e '.name == "openprose"' .claude-plugin/marketplace.json
          jq -e '.name == "openprose"' .agents/plugins/marketplace.json
          jq -e '.name == "openprose"' .github/plugin/marketplace.json

      - name: Validate Copilot plugin and marketplace
        run: |
          node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync(".github/plugin/plugin.json", "utf8"));
            assert.equal(m.name, "open-prose");
            assert.match(m.version, /^\d+\.\d+\.\d+$/);
            assert.equal(m.skills, "./skills");
            assert.ok(fs.existsSync("skills/open-prose/SKILL.md"), "missing skill");
            const mp = JSON.parse(fs.readFileSync(".github/plugin/marketplace.json", "utf8"));
            assert.equal(mp.name, "openprose");
            assert.ok(mp.owner.name, "missing marketplace owner");
            assert.equal(mp.plugins.length, 1);
            assert.equal(mp.plugins[0].name, m.name);
            assert.equal(mp.plugins[0].source, "./");
            assert.equal(mp.plugins[0].version, m.version);
            console.log("ok: copilot plugin and marketplace");
          '

  copilot-install:
    name: Install Copilot plugin without a model key
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.102

      - name: Install and discover the native envelope in a disposable home
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d "$RUNNER_TEMP/openprose-copilot.XXXXXX")"
          trap 'rm -rf -- "$temp_home"' EXIT
          plugin_root="$temp_home/plugin"
          mkdir -p "$plugin_root/.github/plugin" "$plugin_root/.claude-plugin"
          cp .github/plugin/plugin.json .github/plugin/marketplace.json "$plugin_root/.github/plugin/"
          cp .claude-plugin/plugin.json .claude-plugin/marketplace.json "$plugin_root/.claude-plugin/"
          cp -R skills "$plugin_root/skills"

          # Distinct metadata proves neither manifest came from the Claude fallback.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            for (const [file, change] of [
              [".github/plugin/plugin.json", m => { m.version += "-copilot-smoke"; }],
              [".github/plugin/marketplace.json", m => { delete m.plugins[0].version; }],
              [".claude-plugin/marketplace.json", m => { m.name = "claude-fallback"; }],
            ]) {
              const target = path.join(root, file);
              const manifest = JSON.parse(fs.readFileSync(target, "utf8"));
              change(manifest);
              fs.writeFileSync(target, JSON.stringify(manifest));
            }
          ' "$plugin_root"

          export HOME="$temp_home/home"
          export USERPROFILE="$HOME"
          export XDG_CONFIG_HOME="$HOME/.config"
          export COPILOT_HOME="$HOME/.copilot"
          export COPILOT_CACHE_HOME="$temp_home/cache"
          export COPILOT_AUTO_UPDATE=false
          mkdir -p "$HOME"

          copilot plugin marketplace add "$plugin_root"
          copilot plugin marketplace browse openprose
          copilot plugin install open-prose@openprose
          copilot plugin list --json > "$temp_home/plugins.json"
          node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            const expected = JSON.parse(fs.readFileSync(path.join(root, "plugin/.github/plugin/plugin.json"), "utf8"));
            const plugins = JSON.parse(fs.readFileSync(path.join(root, "plugins.json"), "utf8"));
            const plugin = plugins.find(p => p.name === "open-prose" && p.marketplace === "openprose");
            assert.ok(plugin, "native marketplace plugin not installed");
            assert.equal(plugin.version, expected.version, "native plugin manifest not selected");
            assert.equal(plugin.enabled, true);
            console.log("ok: native Copilot marketplace and plugin selected");
          ' "$temp_home"
          copilot skill list | tee "$temp_home/skills.txt"
          grep -q "Plugin skills:" "$temp_home/skills.txt"
          grep -q "open-prose" "$temp_home/skills.txt"
